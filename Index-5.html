<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning Form Tag</title>
</head>

<body>
    <form action="post">
        <div>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" />
        </div>
        <div>
            <input type="radio" id="Male" name="Gender" value="Gender" placeholder="Gender" />
            <label for="Male">Male</label>
            <input type="radio" id="Female" name="Gender" value="Gender" placeholder="Gender">
            <label for="Female">Female</label>
        </div>        
        <div>
            <label for="Father's name">Father's Name</label>
            <input type="text" id="father's name" name="father's name" placeholder="Enter your father name" />
        </div>

    </form>
</body>

</html>
